# Yard Check-In: CFML-to-JavaScript migration demo
#
#   docker compose up
#
#   http://localhost:3000          -> modern Node/Express app
#   http://localhost:3000/legacy/  -> legacy ColdFusion (Lucee) app
#
# Both apps read and write the SAME Postgres database, the way a real
# gradual migration runs old and new side by side.

services:

  # Front door. Routes requests to the old or new app by URL path.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lucee
      - node

  # Legacy app: ColdFusion (CFML) running on Lucee, the free open-source engine.
  lucee:
    image: lucee/lucee:6.1
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-yard}
      DB_USER: ${POSTGRES_USER:-yard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yard_dev_password}
    volumes:
      - ./legacy-cfml:/var/www
    ports:
      - "8888:8888"   # direct access for debugging; normally use :3000/legacy/
    depends_on:
      db:
        condition: service_healthy

  # Modern app: Node.js + Express.
  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-yard}
      DB_USER: ${POSTGRES_USER:-yard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yard_dev_password}
    volumes:
      - ./modern-node:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Shared database. Scripts in db/init run automatically on FIRST start only.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yard}
      POSTGRES_USER: ${POSTGRES_USER:-yard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yard_dev_password}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on your machine so it won't clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yard} -d ${POSTGRES_DB:-yard}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Database browser: http://localhost:8080
  # Log in with System "PostgreSQL", Server "db", and the user/password/database above.
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
  node_modules:
