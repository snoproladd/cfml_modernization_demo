# The "strangler fig" router.
# Everything goes to the new Node app unless it is under /legacy/.
# As features are migrated, routes move from Lucee to Node one at a time.

server {
    listen 80;

    # Legacy ColdFusion app. The /legacy/ prefix is stripped before Lucee
    # sees the request, so inside the CFML app use RELATIVE links
    # (href="checkin.cfm", not href="/checkin.cfm").
    location /legacy/ {
        proxy_pass         http://lucee:8888/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    # Modern Node app handles everything else.
    location / {
        proxy_pass         http://node:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
